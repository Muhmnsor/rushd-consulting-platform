<form class="form-signin form-signup hide" role="form" data-rushd-signup>
	<div class="page-card-body">
		<div class="form-group">
			<label class="form-label" for="signup_fullname">الاسم الكامل</label>
			<input type="text" id="signup_fullname" class="form-control"
				placeholder="اكتب اسمك الكامل" required autofocus autocomplete="name">
		</div>
		<div class="form-group">
			<label class="form-label" for="signup_email">البريد الإلكتروني</label>
			<input type="email" id="signup_email" class="form-control"
				placeholder="name@example.com" required autocomplete="username">
		</div>
		<div class="form-group">
			<label class="form-label" for="signup_password">كلمة المرور</label>
			<input type="password" id="signup_password" class="form-control"
				placeholder="اختر كلمة مرور قوية" required minlength="8" autocomplete="new-password">
		</div>
		<div class="form-group">
			<label class="form-label" for="signup_password_confirm">تأكيد كلمة المرور</label>
			<input type="password" id="signup_password_confirm" class="form-control"
				placeholder="أعد كتابة كلمة المرور" required minlength="8" autocomplete="new-password">
		</div>
	</div>
	<div class="page-card-actions">
		<button class="btn btn-sm btn-primary btn-block btn-signup" type="submit">
			إنشاء الحساب
		</button>
		<p class="text-center sign-up-message">
			<a href="#login" class="blue">لديك حساب؟ تسجيل الدخول</a>
		</p>
	</div>
</form>
